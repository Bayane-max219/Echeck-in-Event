version: "3.9"

services:
  # ─── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: echeck_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: echeck_in
      MYSQL_USER: echeck_user
      MYSQL_PASSWORD: echeck_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - echeck_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Symfony Backend (PHP-FPM) ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: echeck_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-a8f3b2c1d4e5f6a7b8c9d0e1f2a3b4c5}
      DATABASE_URL: mysql://echeck_user:echeck_password@db:3306/echeck_in?serverVersion=8.0&charset=utf8mb4
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-jwt_passphrase_docker}
      MAILER_DSN: null://null
      FRONTEND_URL: http://localhost
      APP_URL: http://localhost
      CORS_ALLOW_ORIGIN: "^https?://localhost(:[0-9]+)?$"
    volumes:
      - jwt_keys:/var/www/html/config/jwt
      - uploads:/var/www/html/public/uploads
    networks:
      - echeck_network
    expose:
      - "9000"

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: echeck_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - uploads:/var/www/html/public/uploads:ro
    networks:
      - echeck_network

networks:
  echeck_network:
    driver: bridge

volumes:
  db_data:
  jwt_keys:
  uploads:
